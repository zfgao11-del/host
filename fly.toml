# fly.toml app configuration file generated for 3MH Host

app = "host-3mh"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  # DATABASE_URL removed from [env] because it points to a sensitive
  # SQLite file on the persistent volume. The startup script
  # (start-fly.sh) exports it at runtime for Prisma. Optionally set it
  # as a secret with: fly secrets set DATABASE_URL=file:/data/custom.db

[mounts]
  source = "host_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
